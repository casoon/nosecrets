name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  verify-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Wait for CI to complete
        run: |
          echo "Waiting for CI workflow to complete..."
          for i in {1..30}; do
            STATUS=$(gh run list --commit ${{ github.sha }} --workflow=ci.yml --json status,conclusion --jq '.[0]')
            RUNNING=$(echo "$STATUS" | jq -r '.status')
            CONCLUSION=$(echo "$STATUS" | jq -r '.conclusion')

            if [ "$RUNNING" = "completed" ]; then
              if [ "$CONCLUSION" = "success" ]; then
                echo "CI passed!"
                exit 0
              else
                echo "CI failed with conclusion: $CONCLUSION"
                exit 1
              fi
            fi
            echo "CI still running... waiting 10s"
            sleep 10
          done
          echo "Timeout waiting for CI"
          exit 1
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: verify-ci
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
            asset-name: nosecrets-x86_64-apple-darwin.tar.gz
            binary-name: nosecrets
          - target: aarch64-apple-darwin
            os: macos-latest
            asset-name: nosecrets-aarch64-apple-darwin.tar.gz
            binary-name: nosecrets
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            asset-name: nosecrets-x86_64-unknown-linux-gnu.tar.gz
            binary-name: nosecrets
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            asset-name: nosecrets-aarch64-unknown-linux-gnu.tar.gz
            binary-name: nosecrets
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            asset-name: nosecrets-x86_64-pc-windows-msvc.zip
            binary-name: nosecrets.exe

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cross
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo install cross

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Package Unix release asset
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.binary-name }} .
          tar -czf ${{ matrix.asset-name }} ${{ matrix.binary-name }}

      - name: Package Windows release asset
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.binary-name }} .
          7z a ${{ matrix.asset-name }} ${{ matrix.binary-name }}

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: ${{ matrix.asset-name }}

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true

      - name: Create GitHub release
        run: gh release create "${{ github.ref_name }}" artifacts/* --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  npm:
    needs: [github-release]
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Publish npm package
        working-directory: packages/npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

  crates:
    needs: verify-ci
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish -p nosecrets-rules
          sleep 15
          cargo publish -p nosecrets-filter
          sleep 15
          cargo publish -p nosecrets-report
          sleep 15
          cargo publish -p nosecrets-core
          sleep 15
          cargo publish -p nosecrets-cli
