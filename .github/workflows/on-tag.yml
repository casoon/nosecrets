name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  verify-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Wait for CI to complete
        run: |
          echo "Waiting for CI workflow to complete..."
          for _ in {1..30}; do
            STATUS=$(gh run list --commit ${{ github.sha }} --workflow=ci.yml --json status,conclusion --jq '.[0]')
            RUNNING=$(echo "$STATUS" | jq -r '.status')
            CONCLUSION=$(echo "$STATUS" | jq -r '.conclusion')

            if [ "$RUNNING" = "completed" ]; then
              if [ "$CONCLUSION" = "success" ]; then
                echo "CI passed!"
                exit 0
              else
                echo "CI failed with conclusion: $CONCLUSION"
                exit 1
              fi
            fi
            echo "CI still running... waiting 10s"
            sleep 10
          done
          echo "Timeout waiting for CI"
          exit 1
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Validate release versions
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "nosecrets-cli") | .version')
          NPM_VERSION=$(node -p "require('./packages/npm/package.json').version")
          test "$VERSION" = "$CARGO_VERSION"
          test "$VERSION" = "$NPM_VERSION"

  crates:
    needs: verify-ci
    name: Publish to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      # Trusted Publishing: a short-lived token from the workflow's OIDC identity,
      # no registry secret is stored.
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth

      - name: Publish crates
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Library first; versions that already exist are skipped, so a re-run is safe.
          for crate in nosecrets-core nosecrets-cli; do
            if curl -fsS -A "nosecrets-release (github.com/casoon/nosecrets)" \
              "https://crates.io/api/v1/crates/$crate/$VERSION" > /dev/null 2>&1; then
              echo "$crate $VERSION already published, skipping."
            else
              cargo publish --locked -p "$crate"
            fi
          done

  build:
    needs: verify-ci
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            asset-name: nosecrets-aarch64-apple-darwin.tar.gz
            binary-name: nosecrets
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            asset-name: nosecrets-x86_64-unknown-linux-gnu.tar.gz
            binary-name: nosecrets
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            asset-name: nosecrets-aarch64-unknown-linux-gnu.tar.gz
            binary-name: nosecrets
            cross: true
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            asset-name: nosecrets-x86_64-unknown-linux-musl.tar.gz
            binary-name: nosecrets
            cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            asset-name: nosecrets-aarch64-unknown-linux-musl.tar.gz
            binary-name: nosecrets
            cross: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            asset-name: nosecrets-x86_64-pc-windows-msvc.zip
            binary-name: nosecrets.exe

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install cross
        if: matrix.cross
        run: cargo install cross

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Package Unix release asset
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.binary-name }} .
          tar -czf ${{ matrix.asset-name }} ${{ matrix.binary-name }}

      - name: Package Windows release asset
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.binary-name }} .
          7z a ${{ matrix.asset-name }} ${{ matrix.binary-name }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ matrix.asset-name }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: ${{ matrix.asset-name }}

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true

      - name: Generate checksums
        working-directory: artifacts
        run: sha256sum -- * > SHA256SUMS

      - name: Create GitHub release
        run: gh release create "${{ github.ref_name }}" artifacts/* --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  npm:
    needs: [github-release]
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Update npm (Trusted Publishing needs >= 11.5)
        run: npm install -g npm@latest

      - name: Publish npm package
        working-directory: packages/npm
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view "@casoon/nosecrets@$VERSION" version 2>/dev/null || true)
          if [ "$PUBLISHED" = "$VERSION" ]; then
            echo "Version $VERSION already published, skipping."
          else
            npm publish --access public
          fi
