[package]
name = "nosecrets-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
# The repository root is the package, so `cargo install --path .` (used by pre-commit's
# `language: rust`) works. Only the files below go into the published crate.
include = ["/src/**", "/tests/**", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
nosecrets-core = { path = "crates/nosecrets-core", version = "0.5.0" }

[dev-dependencies]
tempfile.workspace = true

[[bin]]
name = "nosecrets"
path = "src/main.rs"

[workspace]
members = [".", "crates/nosecrets-core"]
default-members = [".", "crates/nosecrets-core"]
resolver = "2"

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/casoon/nosecrets"
homepage = "https://casoon.github.io/nosecrets/"
rust-version = "1.88"
description = "Fast, offline secret scanner for Git pre-commit hooks"
keywords = ["security", "secrets", "git", "pre-commit", "scanner"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
# CLI
clap = { version = "4", features = ["derive"] }

# Regex & Pattern Matching
regex = "1"
aho-corasick = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

# Async/Parallel
rayon = "1"

# Utilities
thiserror = "2"
anyhow = "1"
walkdir = "2"
sha2 = "0.11"
globset = "0.4"

# Terminal
anstream = "1"
anstyle = "1"

# Testing
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
