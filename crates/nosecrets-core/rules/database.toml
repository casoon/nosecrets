[[rule]]
id = "jdbc-password-param"
name = "JDBC Connection Password"
severity = "high"
pattern = '''(?i)\bjdbc:(?:postgresql|mysql|mariadb|sqlserver|mssql):\/\/[^\s'\"]{0,200}?(?:password|pwd)=([^&\s'\"]{6,})'''
keywords = ["jdbc", "password"]
capture = 1

[rule.allow]
patterns = ["(?i)example|changeme|password|your|test|^x{3,}$", "^\\$\\{?[A-Z0-9_]+\\}?$"]
match_patterns = ['''(?i)@(?:localhost|127\.0\.0\.1|\[::1\]|0\.0\.0\.0|host\.docker\.internal|(?:[a-z0-9-]+\.)*example\.(?:com|org|net))(?::\d+)?(?:[/?,]|$)''']
