# Self-scan configuration: `nosecrets scan --tracked` must pass on this repository.
# Every exception below is scoped to fixtures or rule definitions; no rule is disabled.

[ignore]
paths = [
  # The site's terminal captures stage the example keys from the AWS documentation on
  # purpose (site/captures/capture.sh); the SVG scene shows the same file.
  "site/captures/",
  # Behavioral fixtures: each built-in rule is tested against a matching fake credential,
  # so this file has to contain values every rule detects.
  "crates/nosecrets-core/tests/",
  # Rule definitions: the regexes and allow patterns in these files read as
  # high-entropy strings, but contain no credentials.
  "crates/nosecrets-rules/rules/*.toml",
]

[allow]
values = [
  # Synthetic token used by the entropy unit tests in crates/nosecrets-core/src/entropy.rs.
  "xK9mB2vL5nQ8rT3wA7jP1hD6fY4cE0g",
]
