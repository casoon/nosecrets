# Database Connection Secrets

[[rule]]
id = "postgres-connection-uri"
name = "Postgres Connection URI"
severity = "high"
pattern = '''(?i)\bpostgres(?:ql)?:\/\/[^:\s\/]+:([^@\s\/]+)@[^ \n'\"]+'''
keywords = ["postgres", "postgresql"]
capture = 1

[rule.allow]
patterns = ["(?i)example|changeme|password|your|test|^x{3,}$", "^\\$\\{?[A-Z0-9_]+\\}?$"]
match_patterns = ['''(?i)@(?:localhost|127\.0\.0\.1|\[::1\]|0\.0\.0\.0|host\.docker\.internal|(?:[a-z0-9-]+\.)*example\.(?:com|org|net))(?::\d+)?(?:[/?,]|$)''']

[[rule]]
id = "mysql-connection-uri"
name = "MySQL Connection URI"
severity = "high"
pattern = '''(?i)\b(?:mysql|mariadb):\/\/[^:\s\/]+:([^@\s\/]+)@[^ \n'\"]+'''
keywords = ["mysql", "mariadb"]
capture = 1

[rule.allow]
